<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портретное портфолио - Яков Лазаревский</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Anonymous+Pro:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header header--white">
        <div class="container header__container">
            <div class="header__logo">
                <span class="header__logo-title">Фотограф</span>
                <span class="header__logo-name">Яков Лазаревский</span>
            </div>
            
            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                    <li class="nav__item"><a href="portfolio.html" class="nav__link">Портфолио</a></li>
                    <li class="nav__item"><a href="services.html" class="nav__link">Услуги</a></li>
                    <li class="nav__item"><a href="contacts.html" class="nav__link">Контакты</a></li>
                </ul>
            </nav>
            
            <button class="burger" aria-label="Меню" aria-expanded="false">
                <span class="burger__line"></span>
                <span class="burger__line"></span>
                <span class="burger__line"></span>
            </button>
        </div>
    </header>

    <section class="portrait-portfolio-page">
        <div class="container">
            <h1 class="portrait-portfolio-page__title">Портретные фотографии</h1>
            
            <div class="portrait-portfolio-page__grid">
                <div class="portrait-portfolio-page__item portrait-portfolio-page__item--tall">
                    <img src="img/50.svg" alt="Портретное фото" class="portrait-portfolio-page__img">
                </div>
                
                <div class="portrait-portfolio-page__item portrait-portfolio-page__item--small">
                    <img src="img/image 27.svg" alt="Портретное фото" class="portrait-portfolio-page__img">
                </div>
                
                <div class="portrait-portfolio-page__item portrait-portfolio-page__item--medium">
                    <img src="img/51.svg" alt="Портретное фото" class="portrait-portfolio-page__img">
                </div>
                
                <div class="portrait-portfolio-page__item portrait-portfolio-page__item--medium-vertical">
                    <img src="img/52.svg" alt="Портретное фото" class="portrait-portfolio-page__img">
                </div>
                
                <div class="portrait-portfolio-page__item portrait-portfolio-page__item--tall-bw">
                    <img src="img/54.svg" alt="Портретное фото" class="portrait-portfolio-page__img">
                </div>
                
                <div class="portrait-portfolio-page__item portrait-portfolio-page__item--tall-color">
                    <img src="img/53.svg" alt="Портретное фото" class="portrait-portfolio-page__img">
                </div>
            </div>
            
            <div class="portrait-portfolio-page__categories">
                <a href="wedding-portfolio.html" class="portrait-portfolio-page__category">
                    <div class="portrait-portfolio-page__category-image">
                        <img src="img/image 2.svg" alt="Свадебные фото" class="portrait-portfolio-page__category-img">
                    </div>
                    <p class="portrait-portfolio-page__category-title">Свадебные<br>фото</p>
                </a>
                
                <a href="studio-portfolio.html" class="portrait-portfolio-page__category">
                    <div class="portrait-portfolio-page__category-image">
                        <img src="img/image 4.svg" alt="Студийная съемка" class="portrait-portfolio-page__category-img">
                    </div>
                    <p class="portrait-portfolio-page__category-title">Студийная<br>съёмка</p>
                </a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer__text">
                © 2025 Яков Лазаревский — фотограф<br>
                Создаю искренние образы для тех, кто ценит моменты.<br>
                Свадьбы • Портреты • Студийная съёмка
            </p>
            <p class="footer__policy">Политика конфиденциальности</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
